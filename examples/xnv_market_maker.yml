# XNV Advanced Market Maker
# Dual ladder MM on XNV_USDT + XNV_XMR, with trend overlay and 2-leg arb.
#
# HOW TO USE:
#   1. Store credentials in OS keychain:
#      python scripts/nonkyc_store_credentials.py --api-key "..." --api-secret "..."
#   2. Run:
#      python bots/run_xnv_mm.py examples/xnv_market_maker.yml
#   3. Dry-run first to verify order placement logic:
#      python bots/run_xnv_mm.py examples/xnv_market_maker.yml --dry-run

base_url: "https://api.nonkyc.io/api/v2"

# Trading pairs
symbol_usdt: "XNV_USDT"
symbol_xmr:  "XNV_XMR"

# Per-pair tick/step precision and fees
pairs:
  XNV_USDT:
    tick_size:    "0.0001"      # bid/ask show 4 decimal places (e.g. 0.1820)
    step_size:    "0.0001"      # base_volume shows 4 decimal places
    fee_rate:     "0.002"       # 0.2% taker fee (volume tier 0, no NKYC discount)
    min_notional: "1.0"
  XNV_XMR:
    tick_size:    "0.00000001"  # XNV/XMR ≈ 0.0009 — verify from ticker/XNV_XMR
    step_size:    "0.0001"
    fee_rate:     "0.002"       # 0.2% taker fee
    min_notional: "0.0022"     # Exchange minimum ~0.002198 XMR

# ── Ladder ────────────────────────────────────────────────────────────────
base_order_size: "50"          # XNV per level-0 order (USDT pair)
num_levels: 5
level_0_offset_pct: "0.003"   # L0 distance from mid = 0.3% of mid price
level_spacing_pct:  "0.015"   # Each deeper level adds 1.5% of mid (~27 ticks apart)
                               #   @ 0.1823: L0=±0.0005, L1=±0.0032, L2=±0.0060,
                               #             L3=±0.0087, L4=±0.0115
size_step_factor:   "0.5"     # Level k size = base * (1 + k * 0.5)
                               #   L0=1.0x  L1=1.5x  L2=2.0x  L3=2.5x  L4=3.0x
xmr_qty_fraction:   "0.60"    # XNV_XMR orders = 60% of USDT order size
order_size_jitter_pct: "0.10" # ±10% random per-order size variation
level_reprice_threshold_pct: "0.05"     # Safety net: reprice if drift >5% from ideal. Crossing the book triggers reprice first.
max_order_age_sec: 3600

# ── Inventory (3-asset target) ────────────────────────────────────────────
inventory_target:
  XNV:  "0.60"
  USDT: "0.30"
  XMR:  "0.10"
inventory_tolerance_pct: "0.05"   # Start skewing when off-target by 5%
inventory_skew_pct:       "0.003" # Shift ladder center by up to 0.3% of mid

# ── Trend overlay ─────────────────────────────────────────────────────────
trend_threshold:  "0.003"    # 0.3% weighted move triggers directional bias
trend_deadzone:   "0.001"    # Signal must drop below 0.1% to return to neutral
ladder_shift_pct: "0.004"    # Shift ladder center by 0.4% of mid when trending

# Taker bites on XNV_USDT only
taker_bite_size_factor:  "0.30"  # 0.3x base_order_size per bite
taker_bite_interval_sec: 300     # One bite at most every 5 minutes
taker_max_exposure:      "5.0"   # Stop biting after 5x base_order_size accumulated

# ── Arbitrage ─────────────────────────────────────────────────────────────
arb_z_threshold:    "2.0"    # Z-score of implied rate deviation to trigger arb
arb_min_profit_pct: "0.005"  # 0.5% minimum net profit after fees (total fees = 0.4%: 0.2% × 2 legs)
arb_max_order_size: "50"     # XNV — hard cap per arb execution
arb_depth_pct:      "0.30"   # Cap at 30% of available depth at best bid/ask
arb_cooldown_sec:   60       # Minimum seconds between arb executions
arb_ratio_window:   100      # Samples used for rolling mean/std of implied rate
arb_retry_ticks:    5        # Retry stuck leg 2 this many times before giving up

# ── Polling ───────────────────────────────────────────────────────────────
poll_interval_sec:  15
balance_refresh_sec: 30

# ── REST settings ─────────────────────────────────────────────────────────
rest_timeout_sec: 30.0
rest_retries: 3

# ── State persistence ─────────────────────────────────────────────────────
state_path: "state/xnv_mm_state.json"

# Logging: --log-level controls the terminal (default INFO).
# File always captures DEBUG regardless of --log-level.
# Remove or comment out log_file to disable file logging entirely.
# File is date-stamped automatically: logs/xnv_mm.2026-05-22.log
log_file:   "logs/xnv_mm.log"
fills_csv:  "logs/xnv_fills.csv"

# ── Cost-basis sell scaling ────────────────────────────────────────────────
# Ladder sell sizes scale between min/max factor over the ±range below/above avg cost.
# At avg_cost: 1.0×. At -range: min factor. At +range: max factor.
# Gate disabled when avg_cost_xnv == 0 in state file.
cost_basis_scale_range_pct: "0.20"   # ±20% price range for full scale effect
cost_basis_min_sell_factor: "0.20"   # 20% of normal size when 20%+ below cost
cost_basis_max_sell_factor: "2.0"    # 200% of normal size when 20%+ above cost
